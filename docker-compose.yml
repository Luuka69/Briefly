version: "3.8"

services:
  backend:
    build:
      context: ./backend
    container_name: briefly-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: briefly-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  rag-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-agent-service
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - C:\Users\malek\.ollama:/root/.ollama
    command: serve
    restart: unless-stopped
