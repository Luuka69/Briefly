services:
  backend:
    build:
      context: ./backend
    container_name: briefly-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: briefly-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

